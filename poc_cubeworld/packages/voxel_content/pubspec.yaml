name: voxel_content
description: >-
  Game content for voxel_core: block and item registries by string id, tags,
  mining times, inventories, crafting recipes, loot tables and status effects.
  Pure Dart.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  meta: ^1.15.0
  vector_math: ^2.1.4
  voxel_core: ^0.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
