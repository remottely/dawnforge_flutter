name: voxel_worldgen
description: >-
  Declarative world generation for voxel_core: noise, terrain recipes, biomes,
  caves, ores, trees and structures, as a ChunkGenerator. Pure Dart.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

# No Flutter SDK dependency, on purpose: generation runs on worker isolates and
# in `dart test`.
dependencies:
  meta: ^1.15.0
  vector_math: ^2.1.4
  voxel_core: ^0.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
