name: cubeworld_poc
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

# The voxel packages grow here, out of the POC (docs/VOXEL_PACKAGES_PLAN_2026-09-14.md).
workspace:
  - packages/voxel_engine
  - packages/voxel_scene
  - packages/voxel_scene/example
  - packages/voxel_audio
  - packages/voxel_game
  - packages/voxel_game/example

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.23.0
  flutter_soloud: ^4.1.7
  gamepads: ^0.1.12
  hooks: ^2.2.0
  path_provider: ^2.1.6
  pointer_lock: ^0.4.1
  vector_math: ^2.4.2
  voxel_audio: ^0.0.0
  voxel_engine: ^0.0.0
  voxel_game: ^0.0.0
  voxel_scene: ^0.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - flutter_scene_generated/
    - assets/audio/footstep/forest/
    - assets/audio/footstep/desert/
    - assets/audio/footstep/snow/
    - assets/audio/footstep/swamp/
    - assets/audio/footstep/lava/
    - assets/audio/music/
    - ROADMAP.md # stage 30: the credits read the stage table at runtime
  uses-material-design: true
