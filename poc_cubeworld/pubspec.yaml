name: cubeworld_poc
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.23.0
  flutter_soloud: ^4.1.7
  gamepads: ^0.1.12
  hooks: ^2.2.0
  path_provider: ^2.1.6
  pointer_lock: ^0.4.1
  sound_recipes: ^0.0.0
  vector_math: ^2.4.2
  voxel_engine: ^0.0.0
  voxel_game: ^0.0.0
  voxel_scene: ^0.0.0

# The kit is not part of this project's resolution: it is consumed by path, the one
# edge that changes when packages/voxel_game/ leaves for its own repository.
dependency_overrides:
  voxel_game:    {path: packages/voxel_game}
  voxel_engine:  {path: packages/voxel_game/packages/voxel_engine}
  voxel_scene:   {path: packages/voxel_game/packages/voxel_scene}
  sound_recipes: {path: packages/voxel_game/packages/sound_recipes}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - flutter_scene_generated/
    - assets/audio/footstep/forest/
    - assets/audio/footstep/desert/
    - assets/audio/footstep/snow/
    - assets/audio/footstep/swamp/
    - assets/audio/footstep/lava/
    - assets/audio/music/
    - ROADMAP.md # stage 30: the credits read the stage table at runtime
  uses-material-design: true
