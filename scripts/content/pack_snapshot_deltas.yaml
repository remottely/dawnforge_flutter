    why: '`sprite_anchor` is INERT here — no Dart data class reads it. It is a Godot Node2D anchoring
      convention; the Flutter renderer anchors a world object at its tile (FP3.3). Nothing here would
      change if the value matched. `bar_offset_y` differs by one pixel and nothing draws a bar yet — the
      HUD''s vitals are FP5.1. Whichever value is right is decided by looking at the first drawn bar,
      not by copying. The player''s pools are this port''s own numbers, authored at 0.23.0 when the player
      became an actor: 50 energy against the spec''s 500, 5 mana against 25, 10 stamina against 5. Nothing
      spends any of them yet (action costs wait with `HeldItemComponent`, PENDING #8), so they are numbers
      with no behaviour behind them on either side. The player''s display name and description are authored
      ONLY here — the spec''s player is never named to itself.'
