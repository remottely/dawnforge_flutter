name: darkness_dungeon
description: "A new Flutter project."

publish_to: "none"

version: 1.76.3+1

environment:
  sdk: ^3.8.1
  flutter: ^3.32.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Game Framework
  bonfire: ^3.16.1
  flame_audio: ^2.10.2
  flame_splash_screen: ^0.3.1

  # Utilities
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  
  # Dependency Injection
  get_it: ^9.2.0

  # Platform Specific
  win32: ^5.10.0
  web: ^1.1.0

  flame: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: any

  # Linting
  flutter_lints: ^5.0.0
  very_good_analysis: ^9.0.0
  
  # Testing
  mocktail: ^1.0.4

