name: dawnforge
description: "Tessera-Dart — the Flutter study track of the Dawnforge content engine."

publish_to: "none"

# 0.MINOR.PATCH+BUILD — major locked at 0 (rule 14). Bumped from HEAD in the same
# command as the commit (CLAUDE.md §Parallel sessions).
version: 0.2.0+2

environment:
  sdk: ^3.12.0-14.0.dev

# Sorted alphabetically (sort_pub_dependencies). Highlights: Flame direct, no
# Bonfire (decision D2); get_it is the service locator behind rule 28.
dependencies:
  flame: ^1.30.1
  flame_audio: ^2.10.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.0
  meta: ^1.16.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

# The analyzer is half the rule set (rule 4): flutter_lints + very_good_analysis.
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
