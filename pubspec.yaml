name: dawnforge
description: "Tessera-Dart — the Flutter study track of the Dawnforge content engine."

publish_to: "none"

# 0.MINOR.PATCH+BUILD — major locked at 0 (rule 14). Bumped from HEAD in the same
# command as the commit (CLAUDE.md §Parallel sessions).
version: 0.54.0+74

environment:
  sdk: ^3.12.0-14.0.dev

# Sorted alphabetically (sort_pub_dependencies). Highlights: Flame direct, no
# Bonfire (decision D2); get_it is the service locator behind rule 28.
dependencies:
  flame: ^1.30.1
  flame_audio: ^2.10.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.0
  meta: ^1.16.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

# The analyzer is half the rule set (rule 4): flutter_lints + very_good_analysis.
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

  # Every folder the pipeline writes into (a Flutter asset dir includes only
  # its DIRECT files, so each is listed). A new content folder joins this list
  # in the same commit the pipeline first writes it — until step 08 grows a
  # generator for this block.
  assets:
    - assets/generated/dawnforge/forge_almanac/
    - assets/generated/dawnforge/forge_almanac/01_biomes/t1/actors/
    - assets/generated/dawnforge/forge_almanac/01_biomes/t1/actors/sprites/
    - assets/generated/dawnforge/forge_almanac/01_biomes/t1/ground/
    - assets/generated/dawnforge/forge_almanac/01_biomes/t1/items/
    - assets/generated/dawnforge/forge_almanac/01_biomes/t1/items/sprites/
    - assets/generated/dawnforge/forge_almanac/01_biomes/t1/props/
    - assets/generated/dawnforge/forge_almanac/01_biomes/t1/props/sprites/
    - assets/generated/dawnforge/forge_almanac/01_biomes/t2/items/
    - assets/generated/dawnforge/forge_almanac/01_biomes/t2/items/sprites/
    - assets/generated/dawnforge/forge_almanac/02_workstations/01_smelter/t1/
    - assets/generated/dawnforge/forge_almanac/02_workstations/01_smelter/t1/sprites/
    - assets/generated/dawnforge/forge_almanac/02_workstations/02_workshop/t1/
    - assets/generated/dawnforge/forge_almanac/02_workstations/02_workshop/t1/sprites/
    - assets/generated/dawnforge/forge_almanac/02_workstations/04_seed_station/t1/
    - assets/generated/dawnforge/forge_almanac/02_workstations/04_seed_station/t1/sprites/
    - assets/generated/dawnforge/forge_almanac/02_workstations/04_seed_station/t2/
    - assets/generated/dawnforge/forge_almanac/02_workstations/04_seed_station/t2/sprites/
    - assets/generated/dawnforge/forge_almanac/03_farm/t1/
    - assets/generated/dawnforge/forge_almanac/03_farm/t1/sprites/
    - assets/generated/dawnforge/forge_almanac/03_farm/t2/
    - assets/generated/dawnforge/forge_almanac/03_farm/t2/sprites/
    - assets/generated/dawnforge/forge_almanac/player/
    - assets/generated/dawnforge/cosmetics/03_skin/vampire/sprites/
    - assets/generated/dawnforge/locales/
