org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9's built-in Kotlin bundles KGP 2.2.10, below Flutter's 2.2.20 minimum, so
# the Kotlin Gradle Plugin stays applied explicitly (see android/settings.gradle.kts).
android.builtInKotlin=false
# Flutter 3.47's Gradle plugin still reads AGP's legacy DSL interface.
android.newDsl=false
