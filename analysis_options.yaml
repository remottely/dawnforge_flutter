# Análise estática — Dawnforge
#
# Estratégia: `flutter_lints` como base, com um conjunto pequeno de regras
# desligadas *temporariamente* enquanto a dívida correspondente é paga.
#
# Cada `false` abaixo tem um dono e uma fase no plano de refatoração
# (documentation/refactoring/). Ao zerar as ocorrências de uma regra, apague a
# linha — o objetivo é este arquivo ficar só com o `include`.
#
# Regra de ouro: `flutter analyze` não deve ganhar avisos NOVOS em nenhum commit.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "assets/analyze_assets.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  errors:
    # Erros de verdade — não deixe passar.
    unused_import: warning
    dead_code: warning
    unrelated_type_equality_checks: error
    invalid_override: error

linter:
  rules:
    # ---------------------------------------------------------------------
    # DESLIGADAS TEMPORARIAMENTE — dívida mapeada, ver refactoring/
    # ---------------------------------------------------------------------

    # ~99 ocorrências. Enums legadas em snake_case (HandItemId.empty_seed_bag)
    # e em UPPER (InterfaceType.HUD). Renomear é breaking em saves.
    # → Fase 4 (exige migração de save).
    constant_identifier_names: false

    # ~43 ocorrências. Trocar por GameLogger.
    # → Fase 1.
    avoid_print: false

    # Convenção do projeto: campos `k`/`_k` em classes de config são const
    # públicos por design.
    # → permanente.
    public_member_api_docs: false

    # CONFLITA com a ordem de classe do CLAUDE.md §3.3, que põe os campos
    # antes do construtor — padrão de todo o codebase. Rodar
    # `dart fix --code=sort_constructors_first` reescreve 140 arquivos contra
    # a convenção documentada. Convenção do projeto vence a default do lint.
    # → permanente, a menos que o CLAUDE.md §3.3 mude antes.
    sort_constructors_first: false

    # ---------------------------------------------------------------------
    # ATIVADAS ALÉM DO flutter_lints — reforçam convenções do CLAUDE.md
    # ---------------------------------------------------------------------
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    avoid_returning_null_for_void: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    empty_catches: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    test_types_in_equals: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_statements: true
    use_string_buffers: true
